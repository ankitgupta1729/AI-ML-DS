name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Lint tooling and check doc links
    runs-on: ubuntu-latest
    steps:
      # the repository is ~13 GB: fetch only docs and tooling, without file contents
      # elsewhere (links are resolved against `git ls-files`)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*.md
            /*/README.md
            /docs/
            /tools/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint repository tooling
        run: pipx run ruff check --config tools/ruff.toml tools/
      - name: Check doc links and the PDF catalog
        run: python tools/check_links.py
